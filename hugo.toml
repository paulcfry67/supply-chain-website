baseURL = 'https://supplychaindaily.news'
languageCode = 'en-us'
title = 'Supply Chain Daily'
theme = 'hugo-news'

[pagination]
    pagerSize = 10
# Comments and analytics 
[services]
  [services.disqus]
    shortname = ""
  [services.googleAnalytics]
    id = ""

# Markup configuration
[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[Params]
    subtitle = "Daily Intelligence on Manufacturing & Logistics" # Subtitle of your site
    description = "Daily supply chain intelligence covering manufacturing, distribution, and logistics challenges with focus on USA automotive industry"
    
    # Author box settings
    [Params.Author] 
        name = "Supply Chain Analysis Team"
        bio = "Expert analysis of supply chain issues in manufacturing and distribution, with emphasis on USA automotive manufacturing."
        avatar = "img/supply-chain-avatar.png"
    opengraph = true
    twitter_cards = true
    readmore = true
    leftsidebar = false
    authorbox = true
    post_navigation = true
    postSections = ["posts"] # Show posts section on home page
    dateformat = "2006-01-02"

[Params.widgets]
    search = true
    recent_articles = true
    recent_articles_num = 10
    categories = true
    tags = true
    tags_counter = true
    
    # Social media for supply chain industry
    social_linkedin = "supply-chain-daily"
    social_twitter = "Axelr8d"
    social_email = "contact@supplychaindaily.news"

# Navigation Menu
[menu]
  [[menu.main]]
    identifier = "home"
    name = "Home"
    url = "/"
    weight = 1
  
  [[menu.main]]
    identifier = "categories"
    name = "Categories"
    url = "/categories/"
    weight = 2
  
  [[menu.main]]
    identifier = "tags"
    name = "Tags"
    url = "/tags/"
    weight = 3
